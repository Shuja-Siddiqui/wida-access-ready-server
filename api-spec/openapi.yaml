          type: integer
        currency:
          type: string
        displayPricePerSeat:
          type: string
          description: Server-formatted price-per-seat string ready to render as-is, e.g. "$20 / seat / month". Frontend must never derive this from pricePerSeatCents.
        displayEstimatedMonthlyCost:
          type: string
          description: Server-formatted estimated monthly cost string ready to render as-is, e.g. "$60 / month", already computed for the given (or requested) seat count.
